# Orange Pi AI Pro 20T, 24 GiB, NVMe root filesystem.
# Install the matching Image and 24g DTB at the paths below before using.
TIMEOUT 10
DEFAULT opiai-6.18.44
MENU TITLE Orange Pi AI Pro 20T

LABEL opiai-6.18.44
    MENU LABEL Linux 6.18.44-opiai
    LINUX /boot/Image-6.18.44-opiai
    FDT /boot/dtb/hi1910b/hi1910B-orangepiaipro20t-24g.dtb
    APPEND console=ttyAMA0,115200 console=tty1 log_redirect=0x1fc000@0x22741000 root=PARTUUID=${distro_bootpart_uuid} rw rodata=off syslog earlycon=pl011,mmio32,0xC4010000 rootwait mpam=of enable_ascend_share_pool ascend_enable_all enable_sp_multi_group_mode init_all_gicr enable_fpga no_console_suspend use_kallsyms_lookup_symbol selinux=0 systemd.unified_cgroup_hierarchy=1 fbcon=map:6 movable_node cma=256M rootfstype=ext4 nvme_core.default_ps_max_latency_us=0 pcie_aspm=off pcie_port_pm=off
